[package]
name = "newganmanager"
version = "2.0.0"
edition = "2021"
description = "Football Manager NewGAN Replacement Tool"

[lib]
name = "newganmanager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
rand = "0.9"
chrono = "0.4"

[dev-dependencies]
tempfile = "3"
