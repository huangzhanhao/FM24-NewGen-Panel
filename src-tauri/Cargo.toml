[package]
name = "newganmanager"
version = "2.0.0"
edition = "2021"
description = "Football Manager NewGAN Replacement Tool"

[lib]
name = "newganmanager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# resolver 2 下 build-dependencies 与 dependencies 的 feature 各自独立统一，两处缺一
# 不可：只留下面 [dependencies] 一处，tauri-build 链上的 build 单元仍会炸同样的 E0107。
# 原因与取舍见下。
indexmap = { version = "1.9.3", features = ["std"] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
rand = "0.9"
chrono = "0.4"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
tauri-plugin-log = "2"
# indexmap 1.9.3 的 std 由 build.rs 探测（autocfg 派生子进程编译探测源码）。本机 spawn
# 子进程时把匿名管道接到 stdin 必失败（Win32 231），探测源码喂不进去 ⇒ 不 emit has_std
# ⇒ `IndexMap<K, V, S>` 落到无默认值的 #[cfg(not(has_std))] 分支。而 tauri-build /
# tauri-plugin / tauri-utils 锁 schemars ^0.8.22 且开 preserve_order，schemars 的
# `Map<K, V>` 别名只传 2 个泛型参数 ⇒ E0107。显式开 std 即让 build.rs 直接 emit、
# 跳过探测（探测失败时 cargo 输出里有 autocfg 的 warning，可据此确认卡在这一环）。
# 勿换依赖版本试：schemars 声明 indexmap "1.2"，主清单写 2.x 只会多出一个无关实例；
# tauri 全系（含最新稳定版）仍锁 schemars 0.8，其 Map 别名是公开 API，升主版本须连
# tauri 一起大改。为省这两行去 vendor 整个 indexmap 改 build.rs，代价 21 文件/266K。
indexmap = { version = "1.9.3", features = ["std"] }

[dev-dependencies]
tempfile = "3"
